[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mysql-editor"
version = "0.1.0"
description = "A clean-room Windows desktop SQL IDE for MySQL."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PySide6>=6.8,<7",
  "mysql-connector-python>=9.2,<27",
  "keyring>=25.5,<27",
  "argon2-cffi>=23.1,<26",
  "sqlglot>=26,<30",
  "platformdirs>=4.3,<5",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "pip-audit>=2.7,<3"]

[project.scripts]
mysql-editor = "mysql_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "E501", "I001", "S110", "S608", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
