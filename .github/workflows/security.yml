name: Desktop dependency security

on:
  push:
    branches: [main, desktop-rebuild]
  pull_request:
    branches: [main, desktop-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependency audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit declared dependencies
        run: python -m pip_audit -r requirements.txt
