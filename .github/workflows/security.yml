name: Desktop dependency security

on:
  push:
    branches: [main, desktop-rebuild]
  pull_request:
    branches: [main, desktop-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project, test, and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller pip-licenses
      - name: Audit declared runtime dependency constraints
        run: python -m pip_audit -r requirements.txt
      - name: Audit installed test and packaging environment
        run: python -m pip_audit
