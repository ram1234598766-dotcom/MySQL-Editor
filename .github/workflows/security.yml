name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-editor-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python dependency and static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit==2.10.1 bandit==1.9.4
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run Bandit static security scan
        run: bandit -q -r -ll -s B608 feature_governor.py sql_toolbox.py mysql_idle.py mobile_companion.py
