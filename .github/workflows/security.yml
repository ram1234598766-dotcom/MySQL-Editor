name: Desktop dependency security

on:
  push:
    branches: [main, desktop-rebuild]
  pull_request:
    branches: [main, desktop-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project, test, and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller pip-licenses
      - name: Audit declared runtime dependency constraints
        run: python -m pip_audit -r requirements.txt
      - name: Audit installed test and packaging environment
        run: python -m pip_audit
