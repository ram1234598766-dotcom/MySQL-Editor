name: Build Windows EXE and Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build-exe-apk.yml"
      - "*.py"
      - "*.spec"
      - "requirements.txt"
      - "MySQLIDLE.iss"
      - "build_windows.ps1"
      - "android-app/**"
      - "tools/generate_brand_assets.py"
      - "tools/sync_logo_resources.py"
      - "assets/mysqlidle-logo.png"
  pull_request:
    paths:
      - ".github/workflows/build-exe-apk.yml"
      - "*.py"
      - "*.spec"
      - "requirements.txt"
      - "MySQLIDLE.iss"
      - "build_windows.ps1"
      - "android-app/**"
      - "tools/generate_brand_assets.py"
      - "tools/sync_logo_resources.py"
      - "assets/mysqlidle-logo.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysqlidle-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    name: Build Windows EXE and installer
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python 3.15.0
        shell: pwsh
        run: |
          winget install 9NQ7512CXL7T -e --accept-package-agreements --accept-source-agreements --disable-interactivity
          $managerCommand = (Get-Command pymanager -ErrorAction SilentlyContinue).Source
          if (-not $managerCommand) {
            $managerFile = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\PythonSoftwareFoundation.PythonManager_*\pymanager.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($managerFile) { $managerCommand = $managerFile.FullName }
          }
          if (-not $managerCommand) { throw "Official Python Install Manager was not found after installation." }
          & $managerCommand install --configure -y
          if ($LASTEXITCODE -ne 0) { throw "Python Install Manager configuration failed." }
          & $managerCommand install 3.15.0
          if ($LASTEXITCODE -ne 0) { throw "Python 3.15.0 installation failed." }
          $pythonExecutable = (& $managerCommand exec -3.15 -c "import sys; print(sys.executable)" | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $pythonExecutable)) {
            throw "Could not resolve the actual CPython 3.15 interpreter path."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MYSQLIDLE_PYTHON=$pythonExecutable"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $pythonExecutable)
          Write-Host "Using real CPython executable: $pythonExecutable"
          & $pythonExecutable --version
          if ($LASTEXITCODE -ne 0) { throw "The Python 3.15 interpreter did not launch correctly." }
      - name: Install build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:MYSQLIDLE_PYTHON -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $env:MYSQLIDLE_PYTHON -m pip install -r requirements.txt pyinstaller==6.22.3 pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Windows build dependencies installation failed.' }
      - name: Sync exact original logo into Android resource
        run: '& $env:MYSQLIDLE_PYTHON tools/sync_logo_resources.py'
      - name: Generate branded Windows assets
        run: '& $env:MYSQLIDLE_PYTHON tools/generate_brand_assets.py'
      - name: Run regression tests
        shell: pwsh
        run: |
          $testArgs = @(
            "-m", "unittest", "-v",
            "test_mysql_idle.py",
            "test_password_auth.py",
            "test_feature_governor.py",
            "test_sql_toolbox.py",
            "test_packaging_branding.py"
          )
          $stdoutPath = Join-Path $env:RUNNER_TEMP "mysqlidle-tests.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "mysqlidle-tests.stderr.log"
          Remove-Item $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
          $testProcess = Start-Process -FilePath $env:MYSQLIDLE_PYTHON -ArgumentList $testArgs -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if (Test-Path $stdoutPath) { Get-Content $stdoutPath | ForEach-Object { Write-Host $_ } }
          if (Test-Path $stderrPath) { Get-Content $stderrPath | ForEach-Object { Write-Host $_ } }
          if ($testProcess.ExitCode -ne 0) {
            throw "Regression tests failed with exit code $($testProcess.ExitCode)."
          }
          Write-Host "All regression tests passed (exit code 0)."
          exit 0
      - name: Compile Python modules
        shell: pwsh
        run: '& $env:MYSQLIDLE_PYTHON -m py_compile feature_governor.py sql_toolbox.py mysql_idle.py mobile_companion.py test_feature_governor.py test_sql_toolbox.py test_mysql_idle.py test_mobile_companion.py test_packaging_branding.py'
      - name: Build one-folder desktop app
        shell: pwsh
        run: '& $env:MYSQLIDLE_PYTHON -m PyInstaller --clean --noconfirm mysql_idle.spec'
      - name: Build portable single-file EXE
        shell: pwsh
        run: '& $env:MYSQLIDLE_PYTHON -m PyInstaller --clean --noconfirm mysql_idle_portable.spec'
      - name: Smoke-test packaged Windows executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "mysqlidle-smoke-appdata"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $executables = @(
            (Resolve-Path "dist\mysql_idle\mysql_idle.exe").Path,
            (Resolve-Path "dist\MySQLEditor_Portable.exe").Path
          )
          foreach ($exe in $executables) {
            Write-Host "Launching packaged app: $exe"
            $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            try {
              for ($second = 0; $second -lt 15; $second++) {
                Start-Sleep -Seconds 1
                $process.Refresh()
                if ($process.HasExited) {
                  throw "Application exited during startup (code $($process.ExitCode)): $exe"
                }
              }
              Write-Host "Startup smoke test passed: $exe"
            } finally {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Sign Windows application executables
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "mysqlidle-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK SignTool was not found on this runner." }
            $files = @("dist\MySQLEditor_Portable.exe")
            if (Test-Path "dist\mysql_idle") {
              $files += Get-ChildItem "dist\mysql_idle" -Filter "*.exe" -File -Recurse | ForEach-Object { $_.FullName }
            }
            foreach ($file in $files) {
              if (!(Test-Path $file)) { throw "Expected executable to sign was not found: $file" }
              & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /v $file
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file with exit code $LASTEXITCODE" }
              & $signtool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
      - name: Build Windows installer and folder archive
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) {
            & $iscc "MySQLIDLE.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          } else {
            throw "Inno Setup was not found; refusing to publish an incomplete installer."
          }
          if (!(Test-Path "dist\installer\MySQLEditor-Setup.exe")) {
            throw "Inno Setup installer output is missing; refusing to publish an incomplete release."
          }
          Copy-Item "dist\installer\MySQLEditor-Setup.exe" "dist\MySQLEditor-Setup.exe" -Force
      - name: Smoke-test installer, installed launch, and uninstall cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "mysqlidle-installer-smoke-appdata"
          $desktopDir = [Environment]::GetFolderPath([Environment+SpecialFolder]::Desktop)
          if ([string]::IsNullOrWhiteSpace($desktopDir)) { throw "Could not resolve the Windows Desktop folder." }
          New-Item -ItemType Directory -Path $desktopDir -Force | Out-Null
          $desktopShortcut = Join-Path $desktopDir "MySQL Editor.lnk"
          $installDir = Join-Path $env:RUNNER_TEMP "MySQLIDLE-Install-Smoke"
          $setup = (Resolve-Path "dist\MySQLEditor-Setup.exe").Path
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir")
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }

          $installedExe = Join-Path $installDir "mysql_idle.exe"
          if (!(Test-Path $installedExe)) { throw "Installer did not place the desktop executable." }
          if (!(Test-Path $desktopShortcut)) { throw "Installer did not create the MySQL Editor desktop shortcut." }
          $expectedIcon = Join-Path $installDir "_internal\assets\mysqlidle.ico"
          if (!(Test-Path $expectedIcon)) { throw "Installer did not install the shared ICO asset." }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($desktopShortcut)
          if ([IO.Path]::GetFullPath($shortcut.TargetPath) -ine [IO.Path]::GetFullPath($installedExe)) {
            throw "Desktop shortcut target does not point to the installed executable."
          }
          $shortcutIcon = ($shortcut.IconLocation -replace ',\s*\d+$', '').Trim()
          if ([IO.Path]::GetFullPath($shortcutIcon) -ine [IO.Path]::GetFullPath($expectedIcon)) {
            throw "Desktop shortcut does not use the installed MySQL Editor icon."
          }
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
          try {
            for ($second = 0; $second -lt 10; $second++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Installed application exited during startup (code $($app.ExitCode))." }
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

          # User data must survive native uninstall. This also exercises cleanup with a
          # real per-user data file, rather than testing only an empty profile.
          $userDataDir = Join-Path $env:LOCALAPPDATA "MySQL IDLE"
          New-Item -ItemType Directory -Path $userDataDir -Force | Out-Null
          $userDataMarker = Join-Path $userDataDir "preserve-on-uninstall.test"
          Set-Content -LiteralPath $userDataMarker -Value "keep" -Encoding ascii

          $uninstaller = Get-ChildItem -Path $installDir -Filter "unins*.exe" -File | Select-Object -First 1
          if (!$uninstaller) { throw "Installer did not register an uninstaller." }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "mysqlidle-uninstall.log"
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog -Tail 160 }
            throw "Silent uninstall failed with exit code $($uninstall.ExitCode)."
          }
          for ($second = 0; $second -lt 10 -and (Test-Path $installDir); $second++) { Start-Sleep -Seconds 1 }
          if (Test-Path $installDir) { throw "Uninstaller left application files in $installDir." }

          $startMenuShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\MySQL Editor.lnk"
          if (Test-Path $startMenuShortcut) { throw "Uninstaller left the Start Menu shortcut behind." }
          if (Test-Path $desktopShortcut) { throw "Uninstaller left the desktop shortcut behind." }
          if (!(Test-Path $userDataMarker)) { throw "Uninstaller unexpectedly deleted user settings data." }
          Remove-Item -LiteralPath $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Installer launch, shortcuts, native uninstall cleanup, and user-data preservation smoke tests passed."
      - name: Sign Windows installer
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "mysqlidle-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK SignTool was not found on this runner." }
            $file = "dist\MySQLEditor-Setup.exe"
            if (!(Test-Path $file)) { throw "Expected installer to sign was not found: $file" }
            & $signtool.FullName sign /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /v $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for installer with exit code $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Archive signed desktop folder
        shell: pwsh
        run: |
          if (Test-Path "dist\mysql_idle") {
            Compress-Archive -Path "dist\mysql_idle\*" -DestinationPath "dist\MySQLEditor-Folder.zip" -Force
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MySQLEditor-Windows
          path: |
            dist/MySQLEditor_Portable.exe
            dist/MySQLEditor-Folder.zip
            dist/MySQLEditor-Setup.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      ANDROID_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.15.0
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0"
      - name: Install Python runtime dependencies for the mobile companion
        run: python -m pip install -r requirements.txt
      - name: Sync the exact original logo into Android resources
        run: python tools/sync_logo_resources.py
      - name: Run mobile HTTPS integration tests
        run: python -m unittest -v test_mobile_companion.py test_feature_governor.py
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.8.1"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Report Android signing readiness
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_SIGNING_ENABLED: ${{ env.ANDROID_SIGNING_ENABLED }}
          ANDROID_KEYSTORE_BASE64_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD_SET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS_SET: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          ANDROID_KEY_PASSWORD_SET: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [[ "$ANDROID_SIGNING_ENABLED" == "true" ]]; then
            echo "Android signing configuration detected (secret values are hidden)."
            echo "Android release signing: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            missing=()
            [[ "$ANDROID_KEYSTORE_BASE64_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
            [[ "$ANDROID_KEYSTORE_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
            [[ "$ANDROID_KEY_ALIAS_SET" == "true" ]] || missing+=("ANDROID_KEY_ALIAS")
            [[ "$ANDROID_KEY_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEY_PASSWORD")
            echo "::warning::Android release signing unavailable. Missing repository Actions secret names: ${missing[*]}"
            echo "Android release signing: unavailable. Check repository Actions secrets; values are never printed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Locate a previous encrypted signing-key backup
        id: find-signing-backup
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          api = "https://api.github.com/repos/" + repository
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          found = ""
          try:
              runs = get_json(api + "/actions/runs?branch=main&per_page=50").get("workflow_runs", [])
              for run in runs:
                  run_id = run.get("id")
                  if run_id == current_run or run.get("status") != "completed":
                      continue
                  try:
                      artifacts = get_json(
                          api + "/actions/runs/" + str(run_id) + "/artifacts?per_page=100"
                      ).get("artifacts", [])
                  except Exception:
                      continue
                  if any(
                      item.get("name") == "MySQLIDLE-SigningKey-Backup"
                      and not item.get("expired", True)
                      for item in artifacts
                  ):
                      found = str(run_id)
                      break
          except Exception:
              pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("run_id=" + found + "\n")
          print("A previous encrypted signing-key backup is available." if found else
                "No previous encrypted signing-key backup was found.")
          PY
      - name: Download previous encrypted signing-key backup
        if: env.ANDROID_SIGNING_ENABLED == 'true' && steps.find-signing-backup.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: MySQLIDLE-SigningKey-Backup
          run-id: ${{ steps.find-signing-backup.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/key-backup
      - name: Restore encrypted signing-key backup from the original MySQL-IDLE repo if needed
        if: env.ANDROID_SIGNING_ENABLED == 'true' && steps.find-signing-backup.outputs.run_id == ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = "ram1234598766-dotcom/MySQL-IDLE"
          api = "https://api.github.com/repos/" + repo
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MySQL-Editor-signing-backup-recovery",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          try:
              runs = get_json(api + "/actions/runs?branch=main&per_page=50").get("workflow_runs", [])
              archive_url = ""
              for run in runs:
                  if run.get("status") != "completed" or run.get("conclusion") != "success":
                      continue
                  run_id = run.get("id")
                  if not run_id:
                      continue
                  try:
                      artifacts = get_json(api + "/actions/runs/" + str(run_id) + "/artifacts?per_page=100").get("artifacts", [])
                  except Exception:
                      continue
                  match = next((a for a in artifacts if a.get("name") == "MySQLIDLE-SigningKey-Backup" and not a.get("expired", True)), None)
                  if match:
                      archive_url = api + "/actions/artifacts/" + str(match["id"]) + "/zip"
                      break

              if not archive_url:
                  print("::warning::No accessible encrypted signing-key backup was found in MySQL-IDLE.")
              else:
                  request = urllib.request.Request(archive_url, headers=headers)
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = response.read()
                  tmp = Path(os.environ["RUNNER_TEMP"])
                  archive_path = tmp / "legacy-signing-backup.zip"
                  archive_path.write_bytes(payload)
                  backup_dir = tmp / "key-backup"
                  backup_dir.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(archive_path) as archive:
                      member = next((n for n in archive.namelist() if Path(n).name == "MySQLIDLE-SigningKey.jks.enc"), None)
                      if not member:
                          raise ValueError("Encrypted key backup file is missing from the artifact.")
                      info = archive.getinfo(member)
                      if info.file_size > 1024 * 1024:
                          raise ValueError("Encrypted key backup exceeded the expected size limit.")
                      (backup_dir / "MySQLIDLE-SigningKey.jks.enc").write_bytes(archive.read(member))
                  print("Encrypted legacy signing-key backup located; no private-key plaintext was exported.")
          except Exception as error:
              status = getattr(error, "code", None)
              reason = "HTTP " + str(status) if status is not None else type(error).__name__
              print("::warning::Could not retrieve the MySQL-IDLE encrypted signing-key backup (" + reason + "); signing will remain blocked unless the supplied keystore validates.")
          PY
      - name: Restore Android release keystore
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          target = Path(os.environ["RUNNER_TEMP"], "mysqlidle-release.jks")
          try:
              encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
              encoded = encoded.translate(str.maketrans("-_", "+/"))
              encoded += "=" * (-len(encoded) % 4)
              decoded = base64.b64decode(encoded, validate=True)
              if not decoded:
                  raise ValueError("empty payload")
              target.write_bytes(decoded)
          except Exception:
              target.unlink(missing_ok=True)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("ANDROID_KEYSTORE_RESTORE_FAILED=true\n")
              print("::warning::The supplied Android keystore Base64 could not be decoded.")
          else:
              print("Android keystore Base64 decoded; contents remain hidden.")
          PY
      - name: Validate or recover Android signing credentials
        id: validate-signing
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_ALLOW_NEW_SIGNING_KEY: ${{ vars.ANDROID_ALLOW_NEW_SIGNING_KEY }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/mysqlidle-release.jks"
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          new_alias="mysqlidle-release"

          # Prefer the publisher's exact existing signing key. Diagnose store/alias
          # mismatches without displaying passwords or private-key material.
          if [[ "${ANDROID_KEYSTORE_RESTORE_FAILED:-false}" != "true" && -s "$store" ]] &&
             keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            mapfile -t private_aliases < <(
              keytool -list -v -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null |
              awk -F': ' '/^Alias name: / { alias = substr($0, index($0, ": ") + 2) }
                           /^Entry type: PrivateKeyEntry/ { print alias }'
            )
            selected_alias="$ANDROID_KEY_ALIAS"
            alias_found=false
            for candidate in "${private_aliases[@]}"; do
              if [[ "$candidate" == "$selected_alias" ]]; then
                alias_found=true
                break
              fi
            done

            if [[ "$alias_found" != "true" && ${#private_aliases[@]} -eq 1 ]]; then
              selected_alias="${private_aliases[0]}"
              alias_found=true
              echo "::notice::The configured alias was not found; using the only private-key alias in the supplied keystore."
            elif [[ "$alias_found" != "true" && ${#private_aliases[@]} -gt 1 ]]; then
              echo "::warning::The configured alias does not match a private-key entry. Available private-key aliases: ${private_aliases[*]}"
            fi

            selected_key_password=""
            if [[ "$alias_found" == "true" ]] &&
               keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -keypass "$ANDROID_KEY_PASSWORD" -alias "$selected_alias" \
                 -file "$check_dir/input-key-password.csr" >/dev/null 2>&1; then
              selected_key_password="$ANDROID_KEY_PASSWORD"
            elif [[ "$alias_found" == "true" ]] &&
                 keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                   -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$selected_alias" \
                   -file "$check_dir/store-password.csr" >/dev/null 2>&1; then
              selected_key_password="$ANDROID_KEYSTORE_PASSWORD"
              echo "::notice::The supplied keystore uses the store password for its private-key entry."
            fi

            if [[ "$alias_found" == "true" && -n "$selected_key_password" ]]; then
              {
                printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
                printf 'ANDROID_KEY_ALIAS=%s\n' "$selected_alias"
                printf 'ANDROID_KEY_PASSWORD=%s\n' "$selected_key_password"
                echo "ANDROID_KEYSTORE_WAS_REPLACED=false"
              } >> "$GITHUB_ENV"
              echo "replaced=false" >> "$GITHUB_OUTPUT"
              echo "Existing Android signing keystore validated."
              exit 0
            fi
            echo "::warning::The supplied keystore opens, but its private-key alias or entry password could not be validated; checking the encrypted backup."
          else
            echo "::warning::The supplied keystore does not open with ANDROID_KEYSTORE_PASSWORD; checking the encrypted backup."
          fi

          # If the supplied file/credentials fail, try the prior encrypted backup.
          encrypted="$RUNNER_TEMP/key-backup/MySQLIDLE-SigningKey.jks.enc"
          if [[ -s "$encrypted" ]] &&
             openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
               -in "$encrypted" -out "$store" -pass env:ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1 &&
             keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" >/dev/null 2>&1 &&
             keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" -file "$check_dir/backup.csr" >/dev/null 2>&1; then
            {
              printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'ANDROID_KEY_ALIAS=%s\n' "$new_alias"
              printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEYSTORE_WAS_REPLACED=true"
            } >> "$GITHUB_ENV"
            echo "replaced=true" >> "$GITHUB_OUTPUT"
            echo "Previous encrypted Android signing-key backup restored and validated."
            exit 0
          fi

          # Never silently rotate the Android app-signing identity. A missing or
          # invalid keystore can break updates for users who already installed the app.
          if [[ "${ANDROID_ALLOW_NEW_SIGNING_KEY:-false}" != "true" ]]; then
            echo "::error::The provided Android keystore and encrypted backup could not be validated. Release signing was stopped to protect update compatibility. Restore the existing key, or set the repository Actions variable ANDROID_ALLOW_NEW_SIGNING_KEY=true only when intentionally creating a new signing identity."
            exit 1
          fi
          # Explicitly opted-in first release or intentional key replacement.
          if [[ ${#ANDROID_KEYSTORE_PASSWORD} -lt 6 ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD must contain at least 6 characters to create a replacement signing key."
            exit 1
          fi
          echo "::warning::The operator explicitly allowed generation of a new Android signing identity. Existing installations signed by another key cannot be updated by this identity."
          rm -f "$store"
          keytool -genkeypair -v -storetype JKS -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=MySQL Editor Release, O=MySQL Editor" -noprompt >/dev/null 2>&1
          keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" >/dev/null 2>&1
          keytool -certreq -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias "$new_alias" -file "$check_dir/new-key.csr" >/dev/null 2>&1
          {
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$new_alias"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEYSTORE_WAS_REPLACED=true"
          } >> "$GITHUB_ENV"
          echo "replaced=true" >> "$GITHUB_OUTPUT"
          echo "New Android release signing key generated and validated."
      - name: Build release-signed APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mysqlidle-release.jks
        run: gradle --no-daemon assembleRelease
      - name: Verify and stage signed APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/MySQLEditor-Mobile-release.apk
          echo "APK_SMOKE_PATH=dist/MySQLEditor-Mobile-release.apk" >> "$GITHUB_ENV"
          if [[ "${ANDROID_KEYSTORE_WAS_REPLACED:-false}" == "true" ]]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
              -in "$RUNNER_TEMP/mysqlidle-release.jks" \
              -out dist/MySQLIDLE-SigningKey.jks.enc \
              -pass env:ANDROID_KEYSTORE_PASSWORD
            echo "Encrypted replacement-key backup staged for the CI artifact only."
          fi
      - name: Build debug APK when release signing is not configured
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Stage debug APK for CI only
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/MySQLEditor-Mobile-debug.apk
          echo "APK_SMOKE_PATH=dist/MySQLEditor-Mobile-debug.apk" >> "$GITHUB_ENV"
      - name: Verify APK requests only expected Android permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$APK_SMOKE_PATH" <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          apk = Path(sys.argv[1])
          sdk = Path(os.environ["ANDROID_HOME"])
          tool = sdk / "build-tools" / "36.0.0" / "aapt"
          badging = subprocess.run(
              [str(tool), "dump", "badging", str(apk)],
              check=True, capture_output=True, text=True
          )
          import re
          match = re.search(r"targetSdkVersion:'(\d+)'", badging.stdout)
          if not match or int(match.group(1)) < 36:
              raise SystemExit("APK must target Android API level 36 or higher.")
          print("Target API check passed:", match.group(1))

          result = subprocess.run(
              [str(tool), "dump", "permissions", str(apk)],
              check=True, capture_output=True, text=True
          )
          print(result.stdout, end="")
          permissions = []
          for line in result.stdout.splitlines():
              if "uses-permission" in line and "name='" in line:
                  permissions.append(line.split("name='", 1)[1].split("'", 1)[0])
          allowed = {"android.permission.INTERNET"}
          unexpected = sorted(set(permissions) - allowed)
          if unexpected:
              raise SystemExit("Unexpected Android permissions: " + ", ".join(unexpected))
          if "android.permission.INTERNET" not in permissions:
              raise SystemExit("Expected INTERNET permission was not found.")
          print("Permission check passed: only INTERNET is requested.")
          PY
      - name: Smoke-test APK on Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_SMOKE_PATH"
          sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf "no\n" | avdmanager create avd --force -n mysqlidle-smoke -k "system-images;android-36;google_apis;x86_64"
          if [[ ! -s "$ANDROID_AVD_HOME/mysqlidle-smoke.ini" ]]; then
            avdmanager list avd || true
            find "$HOME/.android" -maxdepth 3 -type f -name "*.ini" -print || true
            echo "avdmanager did not create the expected AVD definition." >&2
            exit 1
          fi
          if [[ ! -e /dev/kvm ]]; then
            echo "GitHub runner has no /dev/kvm device; x86_64 Android emulator cannot use hardware acceleration." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd mysqlidle-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/mysqlidle-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            timeout 10s adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          echo "Waiting for the Android emulator to appear in adb..."
          if ! timeout 90s adb wait-for-device; then
            cat "$RUNNER_TEMP/mysqlidle-emulator.log"
            timeout 10s adb devices -l || true
            echo "Android emulator did not appear in adb within 90 seconds." >&2
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mysqlidle-emulator.log"
              echo "Android emulator process exited before boot completed." >&2
              exit 1
            fi
            if ! boot_state="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"; then
              cat "$RUNNER_TEMP/mysqlidle-emulator.log"
              timeout 15s adb logcat -d -t 800 || true
              echo "Android shell did not respond while checking boot state." >&2
              exit 1
            fi
            if [[ "$boot_state" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/mysqlidle-emulator.log"
            timeout 15s adb logcat -d -t 800 || true
            echo "Android emulator did not finish booting within 120 seconds." >&2
            exit 1
          fi
          echo "Emulator booted; installing the APK..."
          if ! timeout 60s adb install -r "$APK_SMOKE_PATH"; then
            timeout 15s adb logcat -d -t 1000 || true
            echo "APK installation failed or timed out." >&2
            exit 1
          fi
          timeout 20s adb shell settings put global window_animation_scale 0
          timeout 20s adb shell settings put global transition_animation_scale 0
          timeout 20s adb shell am force-stop com.mysqlidle.mobile
          echo "Launching MainActivity..."
          if ! timeout 45s adb shell am start -W -n com.mysqlidle.mobile/.MainActivity; then
            timeout 15s adb logcat -d -t 1200 || true
            echo "MainActivity did not start successfully." >&2
            exit 1
          fi
          sleep 2
          app_pid="$(timeout 15s adb shell pidof com.mysqlidle.mobile 2>/dev/null | tr -d '\r' || true)"
          if [[ -z "$app_pid" ]]; then
            timeout 15s adb logcat -d -t 1200 || true
            echo "APK process did not remain alive after launch." >&2
            exit 1
          fi
          echo "App process is alive (PID $app_pid); checking branded connection screen..."
          if ! timeout 45s adb shell uiautomator dump /sdcard/mysqlidle-window.xml >/dev/null; then
            timeout 15s adb logcat -d -t 1200 || true
            echo "Could not inspect the Android connection screen." >&2
            exit 1
          fi
          if ! timeout 30s adb pull /sdcard/mysqlidle-window.xml "$RUNNER_TEMP/mysqlidle-window.xml" >/dev/null; then
            echo "Could not retrieve the Android UI hierarchy." >&2
            exit 1
          fi
          grep -q "Connect to the desktop companion" "$RUNNER_TEMP/mysqlidle-window.xml"
          grep -q "MySQL Editor logo" "$RUNNER_TEMP/mysqlidle-window.xml"
          echo "APK installed and launched. MainActivity stayed alive and showed branded connection UI (PID $app_pid)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MySQLEditor-Android
          path: |
            dist/MySQLEditor-Mobile-*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload encrypted Android signing-key backup
        if: env.ANDROID_SIGNING_ENABLED == 'true' && steps.validate-signing.outputs.replaced == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MySQLIDLE-SigningKey-Backup
          path: dist/MySQLIDLE-SigningKey.jks.enc
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish signed release assets
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) && needs.build-android.result == 'success'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          ANDROID_KEYSTORE_BASE64_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD_SET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          ANDROID_KEY_ALIAS_SET: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          ANDROID_KEY_PASSWORD_SET: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          WINDOWS_BUILD_SUCCESS: ${{ needs.build-windows.result == 'success' }}
        run: |
          echo "ready=$ANDROID_SIGNING_ENABLED" >> "$GITHUB_OUTPUT"
          missing=()
          [[ "$ANDROID_KEYSTORE_BASE64_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ "$ANDROID_KEYSTORE_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ "$ANDROID_KEY_ALIAS_SET" == "true" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ "$ANDROID_KEY_PASSWORD_SET" == "true" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if [[ "$WINDOWS_BUILD_SUCCESS" == "true" ]]; then
            echo "windows_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$WINDOWS_SIGNING_ENABLED" == "true" && "$WINDOWS_BUILD_SUCCESS" == "true" ]]; then
            echo "windows_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$ANDROID_SIGNING_ENABLED" == "true" ]]; then
            {
              echo "## Release signing"
              echo "- Android release APK is configured for signing and will be verified."
              if [[ "$WINDOWS_BUILD_SUCCESS" == "true" && "$WINDOWS_SIGNING_ENABLED" == "true" ]]; then
                echo "- Windows EXE, installer, and folder archive will be included; Authenticode signing is configured and verified."
              elif [[ "$WINDOWS_BUILD_SUCCESS" == "true" ]]; then
                echo "- Windows EXE, installer, and folder archive will be included, but they are NOT Authenticode-signed. A signing-status notice will be attached."
              else
                echo "- The Windows build did not succeed; Windows files will be excluded from this release."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Release publication skipped. Configure all four Android keystore secrets first."
            {
              echo "## Release not published"
              echo "A signed Android APK is required for release publication."
              if [[ ${#missing[@]} -gt 0 ]]; then
                echo "Missing Actions secret names (values are never displayed): ${missing[*]}"
              fi
              echo "Set the missing secrets documented in SIGNING.md, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ ${#missing[@]} -gt 0 ]]; then
              echo "::warning::Missing Android signing Actions secret names: ${missing[*]}"
            fi
          fi
      - name: Download signed Android artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: MySQLEditor-Android
          path: release-assets
      - name: Download Windows build artifacts
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: MySQLEditor-Windows
          path: release-assets
      - name: Create Windows signing-status notice
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready == 'true'
        shell: bash
        env:
          WINDOWS_SIGNED: ${{ steps.signing.outputs.windows_signed }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            printf '%s\n' "Windows EXE and installer: Authenticode signatures were applied and verified by CI." > release-assets/WINDOWS-SIGNING-STATUS.txt
          else
            printf '%s\n' \
              "WARNING: The Windows EXE and installer in this release are NOT Authenticode-signed." \
              "Windows may display SmartScreen or unknown-publisher warnings." \
              "Only download from this official repository and verify SHA256SUMS." \
              "A trusted Windows code-signing certificate was not configured for this build." \
              > release-assets/WINDOWS-SIGNING-STATUS.txt
          fi
      - name: Validate release bundle and generate checksums
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          WINDOWS_BUILD_READY: ${{ steps.signing.outputs.windows_ready }}
        run: |
          set -euo pipefail
          test -s "release-assets/MySQLEditor-Mobile-release.apk"
          cd release-assets
          if [[ "$WINDOWS_BUILD_READY" == "true" ]]; then
            test -s "MySQLEditor_Portable.exe"
            test -s "MySQLEditor-Folder.zip"
            test -s "MySQLEditor-Setup.exe"
            test -s "WINDOWS-SIGNING-STATUS.txt"
          fi
          assets=(MySQLEditor-Mobile-release.apk MySQLEditor_Portable.exe MySQLEditor-Folder.zip MySQLEditor-Setup.exe WINDOWS-SIGNING-STATUS.txt)
          included=()
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] && included+=("$asset")
          done
          sha256sum "${included[@]}" > SHA256SUMS
          echo "SHA-256 checksums generated for: ${included[*]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Android-only release
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready != 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.0-build.{0}', github.run_number) }}
          target_commitish: main
          name: MySQL Editor 3.0 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/MySQLEditor-Mobile-release.apk
            release-assets/SHA256SUMS
      - name: Publish Android and Windows release assets
        if: steps.signing.outputs.ready == 'true' && steps.signing.outputs.windows_ready == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.0-build.{0}', github.run_number) }}
          target_commitish: main
          name: MySQL Editor 3.0 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/MySQLEditor-Mobile-release.apk
            release-assets/MySQLEditor_Portable.exe
            release-assets/MySQLEditor-Folder.zip
            release-assets/MySQLEditor-Setup.exe
            release-assets/WINDOWS-SIGNING-STATUS.txt
            release-assets/SHA256SUMS

  publish-windows-preview:
    name: Publish Windows preview assets independently
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build-windows.result == 'success'
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      WINDOWS_SIGNING_ENABLED: \${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: MySQLEditor-Windows
          path: release-assets

      - name: Validate Windows package and calculate checksums
        shell: bash
        env:
          WINDOWS_SIGNED: \${{ env.WINDOWS_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          test -s release-assets/MySQLEditor-Setup.exe
          test -s release-assets/MySQLEditor_Portable.exe
          test -s release-assets/MySQLEditor-Folder.zip
          if [[ "$WINDOWS_SIGNED" == "true" ]]; then
            printf '%s\n' \
              "Windows binaries: Authenticode signing was configured in the build workflow." \
              "Verify the signer in Windows file properties before deployment." \
              > release-assets/WINDOWS-SIGNING-STATUS.txt
          else
            printf '%s\n' \
              "PREVIEW BUILD — Windows binaries are not Authenticode-signed." \
              "Windows may show an unknown-publisher or SmartScreen warning." \
              "Only use this package if you trust this repository and have verified SHA256SUMS." \
              > release-assets/WINDOWS-SIGNING-STATUS.txt
          fi
          printf '%s\n' \
            "This is a Windows-only preview of the Figma-inspired SQL workspace." \
            "It does not contain an Android APK. Android release signing is handled separately." \
            "Source commit: $GITHUB_SHA" \
            > release-assets/WINDOWS-PREVIEW-NOTICE.txt
          cd release-assets
          sha256sum MySQLEditor-Setup.exe MySQLEditor_Portable.exe MySQLEditor-Folder.zip WINDOWS-SIGNING-STATUS.txt WINDOWS-PREVIEW-NOTICE.txt > SHA256SUMS

      - name: Publish Windows preview release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: windows-preview-\${{ github.run_id }}
          target_commitish: \${{ github.sha }}
          name: MySQL Editor Windows Preview (Build \${{ github.run_number }})
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release-assets/MySQLEditor-Setup.exe
            release-assets/MySQLEditor_Portable.exe
            release-assets/MySQLEditor-Folder.zip
            release-assets/WINDOWS-SIGNING-STATUS.txt
            release-assets/WINDOWS-PREVIEW-NOTICE.txt
            release-assets/SHA256SUMS
