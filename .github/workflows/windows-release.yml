name: MySQL Editor Windows packages

on:
  push:
    branches: [main, desktop-rebuild]
    tags: ["v*"]
  pull_request:
    branches: [main, desktop-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    name: Release test matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Qt system libraries for offscreen UI tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Compile Python
        run: python -m compileall -q src tests tools
      - name: Unit and UI tests (MySQL integration runs in its own gated job)
        run: python -m pytest --ignore=tests/test_mysql_integration.py
      - name: Reject legacy application imports
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = list(Path("src/mysql_editor").rglob("*.py"))
          forbidden = ("mysql_idle", "sql_toolbox", "feature_governor", "password_auth", "mobile_companion")
          violations = [(str(path), name) for path in roots for name in forbidden
                        if name in path.read_text(encoding="utf-8")]
          assert not violations, violations
          PY
      - name: Audit declared runtime dependency constraints
        if: matrix.python-version == '3.14'
        run: python -m pip_audit -r requirements.txt

  mysql-integration:
    name: Release MySQL integration (Python 3.14, MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root-password
          MYSQL_DATABASE: mysql_editor_test
          MYSQL_USER: editor_test
          MYSQL_PASSWORD: integration-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_EDITOR_TEST_HOST: 127.0.0.1
      MYSQL_EDITOR_TEST_PORT: "3306"
      MYSQL_EDITOR_TEST_DATABASE: mysql_editor_test
      MYSQL_EDITOR_TEST_USER: editor_test
      MYSQL_EDITOR_TEST_PASSWORD: integration-test-password
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Qt system libraries for offscreen integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run disposable MySQL integration tests
        run: python -m pytest tests/test_mysql_integration.py -v

  build:
    needs: [release-tests, mysql-integration]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller pip-licenses
      - name: Audit installed test and packaging environment
        run: python -m pip_audit
      - name: Validate Windows signing configuration
        id: signing-config
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_TYPE: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_TYPE || 'self-signed' }}
          SIGNING_REF: ${{ github.ref }}
          SIGNING_REF_NAME: ${{ github.ref_name }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Configure both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD secrets."
          }

          $certificateType = $env:WINDOWS_SIGNING_CERTIFICATE_TYPE.Trim().ToLowerInvariant()
          if ($certificateType -notin @("self-signed", "trusted")) {
            throw "WINDOWS_SIGNING_CERTIFICATE_TYPE must be 'self-signed' or 'trusted'."
          }

          $isTag = $env:SIGNING_REF.StartsWith("refs/tags/")
          $isPreviewTag = $env:SIGNING_REF_NAME -match '(?i)-(alpha|beta|rc|preview)([.-]|$)'
          $signingRequired = $isTag -and -not $isPreviewTag
          if ($signingRequired -and -not $hasCertificate) {
            throw "Stable version tags require an Authenticode PFX certificate and password; refusing an unsigned stable release."
          }

          # Previews are intentionally unsigned even if release-signing secrets exist.
          $enabled = $signingRequired -and $hasCertificate -and $hasPassword
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "certificate_type=$certificateType" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($enabled) {
            if ($certificateType -eq "self-signed") {
              Write-Host "Stable release signing is enabled with a self-signed certificate. Recipient PCs may show unknown-publisher or SmartScreen warnings."
            } else {
              Write-Host "Stable release signing is enabled with a certificate expected to validate against Windows trust policy."
            }
          } else {
            Write-Host "Pull-request, main-branch, and preview-tag builds remain unsigned by policy."
          }
      - name: Create transparent brand assets
        run: python tools/build_brand_assets.py
      - name: Validate signing helper scripts parse
        shell: pwsh
        run: |
          foreach ($scriptPath in @("tools/sign_windows_artifacts.ps1", "tools/test_self_signed_signing.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse errors were found in $scriptPath."
            }
          }
      - name: Validate application startup imports before packaging
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import mysql_editor.app; print('Application and complete Qt UI import graph passed')"
      - name: Exercise Qt preferences and file-operation recovery
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "MySQLEditor-UISmokeData"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          python tools/smoke_test_ui.py
      - name: Capture simulated display-scale UI evidence
        run: python tools/capture_ui_screenshots.py
      - name: Upload simulated display-scale UI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MySQLEditor-UI-Visual-QA
          path: |
            dist/ui-visual-qa/*.png
            dist/ui-visual-qa/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Build application folder
        run: python -m PyInstaller --clean --noconfirm pyinstaller/mysql_editor.spec
      - name: Build portable executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name MySQLEditor-Portable --icon assets/mysql-editor.ico --add-data "assets/mysql-editor-logo.webp;assets" --add-data "assets/mysql-editor-logo-transparent.png;assets" --add-data "assets/mysql-editor.ico;assets" --paths src src/mysql_editor/__main__.py
      - name: Test self-signed signing flow with a temporary certificate
        timeout-minutes: 8
        shell: pwsh
        run: |
          & "tools/test_self_signed_signing.ps1" -Target "dist/MySQLEditor/MySQLEditor.exe"
      - name: Verify configured self-signed certificate without publishing a release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/phase-b/self-signed-windows-signing'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_TYPE: self-signed
          WINDOWS_SIGNING_EXPECTED_THUMBPRINT: A716417B2EEF09FBD91C6E7E044C569438762D91C45C2AAF8F3A7AD2B317E3A8
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The repository signing secrets are unavailable; refusing to report configured-certificate validation."
          }
          $source = Join-Path $env:WINDIR "System32\where.exe"
          $target = Join-Path $env:RUNNER_TEMP "MySQLEditor-ConfiguredSigningSmoke.exe"
          Copy-Item -LiteralPath $source -Destination $target -Force
          try {
            Write-Host "Testing the configured repository certificate against a disposable executable; this branch run cannot publish a release."
            & "tools/sign_windows_artifacts.ps1" -Targets @($target) -SkipTimestamp
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.SignatureType -ne "Authenticode" -or $null -eq $signature.SignerCertificate) {
              throw "The configured executable does not contain an Authenticode signature."
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()
            if ($actualThumbprint -ne $env:WINDOWS_SIGNING_EXPECTED_THUMBPRINT) {
              throw "The configured PFX does not match the approved certificate fingerprint."
            }
            Write-Host "Configured self-signed certificate smoke test passed. The disposable executable will not be published."
          } finally {
            Remove-Item -LiteralPath $target -Force -ErrorAction SilentlyContinue
          }
      - name: Sign and verify application executables
        if: steps.signing-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_CERTIFICATE_TYPE: ${{ steps.signing-config.outputs.certificate_type }}
          WINDOWS_SIGNING_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          & "tools/sign_windows_artifacts.ps1" -Targets @(
            "dist/MySQLEditor/MySQLEditor.exe",
            "dist/MySQLEditor-Portable.exe"
          )
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup installer
        run: iscc installer/MySQLEditor.iss
      - name: Sign and verify Windows installer
        if: steps.signing-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          & "tools/sign_windows_artifacts.ps1" -Targets @(
            "dist/installer/MySQLEditor-Setup.exe"
          )
      - name: Smoke test installer install and uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/installer/MySQLEditor-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "MySQLEditor-SmokeInstall"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", ('/DIR="{0}"' -f $installDir))
          $installProcess = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent installation failed with exit code $($installProcess.ExitCode)" }
          $installedExe = Join-Path $installDir "MySQLEditor.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $installedExe)) { throw "Installer did not install MySQLEditor.exe" }
          if (!(Test-Path $uninstaller)) { throw "Inno Setup uninstaller was not created" }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "MySQL Editor.lnk"
          if (!(Test-Path $desktopShortcut)) { throw "Installer did not create the default desktop shortcut" }
          $uninstallArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstallProcess.ExitCode)" }
          if (Test-Path $desktopShortcut) { throw "Uninstaller left the desktop shortcut behind" }
      - name: Smoke launch packaged applications
        shell: pwsh
        run: |
          $apps = @(
            (Resolve-Path "dist/MySQLEditor/MySQLEditor.exe").Path,
            (Resolve-Path "dist/MySQLEditor-Portable.exe").Path
          )
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "MySQLEditor-SmokeData"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          foreach ($appPath in $apps) {
            $process = Start-Process -FilePath $appPath -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Application exited during startup: $appPath (exit code $($process.ExitCode))"
            }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify expected output files
        shell: pwsh
        run: |
          $expected = @(
            "dist/MySQLEditor/MySQLEditor.exe",
            "dist/MySQLEditor-Portable.exe",
            "dist/installer/MySQLEditor-Setup.exe"
          )
          foreach ($path in $expected) {
            if (!(Test-Path $path)) { throw "Expected package was not created: $path" }
            $item = Get-Item $path
            if ($item.Length -lt 100000) { throw "Package looks incomplete: $path ($($item.Length) bytes)" }
          }
          Get-Item $expected | Format-Table Name,Length
      - name: Generate CycloneDX dependency SBOM and stage release notes
        shell: pwsh
        run: |
          python -m pip_audit -r requirements.txt --format cyclonedx-json --output dist/sbom.cdx.json
          pip-licenses --format=markdown --output-file="dist/THIRD_PARTY_LICENSES.md"
          Copy-Item "RELEASE-NOTES.md" "dist/RELEASE-NOTES.md"
          Copy-Item "WINDOWS_SIGNING.md" "dist/WINDOWS_SIGNING.md"
      - name: Create folder archive and release provenance manifest
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MySQLEditor/*" -DestinationPath "dist/MySQLEditor-Folder.zip" -CompressionLevel Optimal
          $manifestArgs = @("tools/create_release_manifest.py", "--dist", "dist", "--commit", $env:GITHUB_SHA)
          if ("${{ steps.signing-config.outputs.enabled }}" -eq "true") {
            $manifestArgs += @(
              "--signing-status", "signed",
              "--authenticode-verified",
              "--signing-certificate-type", "${{ steps.signing-config.outputs.certificate_type }}"
            )
          }
          python @manifestArgs
      - name: Create SHA-256 checksums for release assets
        shell: pwsh
        run: |
          $items = @(
            "dist/MySQLEditor/MySQLEditor.exe",
            "dist/MySQLEditor-Portable.exe",
            "dist/installer/MySQLEditor-Setup.exe",
            "dist/MySQLEditor-Folder.zip",
            "dist/RELEASE-MANIFEST.json",
            "dist/sbom.cdx.json",
            "dist/RELEASE-NOTES.md",
            "dist/WINDOWS_SIGNING.md",
            "dist/THIRD_PARTY_LICENSES.md"
          )
          foreach ($item in $items) {
            $hash = (Get-FileHash $item -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $item -Leaf)" | Add-Content "dist/SHA256SUMS"
          }
      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MySQLEditor-Windows
          path: |
            dist/MySQLEditor/
            dist/MySQLEditor-Portable.exe
            dist/installer/MySQLEditor-Setup.exe
            dist/MySQLEditor-Folder.zip
            dist/SHA256SUMS
            dist/RELEASE-MANIFEST.json
            dist/sbom.cdx.json
            dist/RELEASE-NOTES.md
            dist/WINDOWS_SIGNING.md
            dist/THIRD_PARTY_LICENSES.md
          if-no-files-found: error
  publish:
    name: Publish Windows preview or release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-windows-preview]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Windows packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: MySQLEditor-Windows
          path: dist
      - name: Publish Windows packages to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            releaseTag="windows-preview-${GITHUB_RUN_ID}"
            releaseTitle="MySQL Editor Windows Preview (Build ${GITHUB_RUN_NUMBER})"
          else
            releaseTag="$GITHUB_REF_NAME"
            releaseTitle="MySQL Editor $GITHUB_REF_NAME"
          fi

          releaseArgs=(
            release create "$releaseTag"
            dist/MySQLEditor-Portable.exe
            dist/installer/MySQLEditor-Setup.exe
            dist/MySQLEditor-Folder.zip
            dist/SHA256SUMS
            dist/RELEASE-MANIFEST.json
            dist/sbom.cdx.json
            dist/RELEASE-NOTES.md
            dist/WINDOWS_SIGNING.md
            dist/THIRD_PARTY_LICENSES.md
            --title "$releaseTitle"
            --notes-file dist/RELEASE-NOTES.md
          )
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            releaseArgs+=(--target "$GITHUB_SHA" --prerelease)
          elif [[ "$releaseTag" =~ -(alpha|beta|rc|preview) ]]; then
            releaseArgs+=(--prerelease)
          fi
          gh "${releaseArgs[@]}"
